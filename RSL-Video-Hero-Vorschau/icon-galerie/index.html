<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animated Icon Gallery</title><style>
:root{--blue:#426b9d;--dark:#071c32;--pale:#edf3f8;--ink:#253246;--sky:#9ad5ff}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1020px;margin:auto;padding:52px 26px}h1{font-size:26px;letter-spacing:-.7px;margin:0 0 8px}p{color:#657386;line-height:1.55;margin:0 0 30px}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px}button{font:inherit;border:1px solid #cfdae6;padding:10px 16px;border-radius:9px;background:#fff;color:#183b64;cursor:pointer}button:hover{background:#eff5fa}button.primary{background:#092039;color:#fff;border-color:#092039}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.tile{border:1px solid #e4eaf0;border-radius:16px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;background:#fff;cursor:pointer;transition:box-shadow .2s,transform .2s}.tile:hover{box-shadow:0 9px 27px #16345612;transform:translateY(-2px)}.iconbox{width:100px;height:100px;border-radius:9px;background:var(--pale);display:grid;place-items:center;color:var(--blue)}.tile.dark .iconbox{background:var(--dark);color:#bfe5ff}.tile strong{font-weight:500;font-size:15px}.tile small{color:#8a98a7;font-size:12px}.ico{width:58px;height:58px;overflow:visible}.ico *{vector-effect:non-scaling-stroke}.stroke{fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.fill{fill:currentColor}.animated .spray-head{animation:press 2.25s ease-in-out infinite;transform-origin:center}.animated .spray-cloud{animation:cloud 2.25s ease-in-out infinite}.animated .spray-dots{animation:dots 2.25s ease-in-out infinite}.animated .mail-letter{animation:mail 2.5s ease-in-out infinite;transform-origin:center}.animated .mail-flap{animation:flap 2.5s ease-in-out infinite;transform-origin:50% 38%}.animated .phone-body{animation:ring 2.5s ease-in-out infinite;transform-origin:50% 50%}.animated .phone-wave1{animation:wave 2.5s ease-in-out infinite}.animated .phone-wave2{animation:wave 2.5s .2s ease-in-out infinite}.animated .pin{animation:bounce 2.4s ease-in-out infinite;transform-origin:center bottom}.animated .spark{animation:blink 2s infinite}.animated .plug{animation:plug 2.5s ease-in-out infinite}.animated .gear{animation:spin 5s linear infinite;transform-origin:30px 30px}.animated .shield-check{animation:check 2.4s ease-in-out infinite}.animated .bolt{animation:flash 2.2s ease-in-out infinite}.animated .leaf{animation:sway 2.8s ease-in-out infinite;transform-origin:38px 48px}.animated .fire{animation:flame 1.8s ease-in-out infinite;transform-origin:30px 47px}.animated .pulse-line{stroke-dasharray:85;animation:draw 2.4s ease-in-out infinite}.animated .factory-smoke{animation:smoke 2.4s ease-in-out infinite}
@keyframes press{0%,16%,53%,100%{transform:translateY(0)}26%,39%{transform:translateY(5px)}}@keyframes cloud{0%,23%,55%,100%{opacity:0;transform:translateX(0) scale(.6)}33%,47%{opacity:1;transform:translateX(-3px) scale(1)}}@keyframes dots{0%,20%,65%,100%{opacity:0}35%,48%{opacity:1}}@keyframes mail{0%,16%{transform:translate(-18px,-18px) scale(.7);opacity:0}40%,68%{transform:translate(0,0) scale(1);opacity:1}83%,100%{opacity:0}}@keyframes flap{0%,38%{transform:scaleY(1)}52%,75%{transform:scaleY(.2)}90%,100%{transform:scaleY(1)}}@keyframes ring{0%,22%,55%,100%{transform:rotate(0)}28%,38%,48%{transform:rotate(-13deg)}33%,43%{transform:rotate(13deg)}}@keyframes wave{0%,24%,54%,100%{opacity:0;transform:scale(.8)}34%,43%{opacity:1;transform:scale(1)}}@keyframes bounce{0%,25%,55%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}@keyframes blink{0%,22%,60%,100%{opacity:.2}35%,48%{opacity:1}}@keyframes plug{0%,23%,70%,100%{transform:translateY(0)}39%,55%{transform:translateY(-8px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes check{0%,25%,90%,100%{stroke-dasharray:19;stroke-dashoffset:19}40%,75%{stroke-dashoffset:0}}@keyframes flash{0%,20%,100%{opacity:1;filter:none}37%,55%{opacity:.55;filter:drop-shadow(0 0 5px #9ad5ff)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(7deg)}}@keyframes flame{0%,100%{transform:scale(.92) rotate(-4deg)}50%{transform:scale(1.08) rotate(5deg)}}@keyframes draw{0%{stroke-dashoffset:85}45%,70%{stroke-dashoffset:0}100%{stroke-dashoffset:-85}}@keyframes smoke{0%,100%{opacity:0;transform:translateY(4px)}40%,70%{opacity:1;transform:translateY(-5px)}}.foot{margin-top:28px;color:#748296;font-size:13px}.paused .animated *{animation-play-state:paused!important}@media(max-width:650px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:185px}.wrap{padding:30px 18px}}@media(prefers-reduced-motion:reduce){.animated *{animation:none!important}}
</style></head><body><main class="wrap"><h1>Animierte Icon-Galerie</h1><p>12 kleine Micro-Animationen im Stil deiner Website. Klicke auf eine Kachel, um ihre Bewegung neu zu starten.</p><div class="bar"><button class="primary" id="toggle">⏸ Animation pausieren</button><button id="replay">↻ Alle neu starten</button></div><section class="gallery" id="gallery"></section><div class="foot">SVG-Line-Icons · CSS-Animationen · Endlosschleife · Unterstützt „Bewegung reduzieren“</div></main><script>
const s=(x)=>`<svg class="ico animated" viewBox="0 0 60 60" aria-hidden="true">${x}</svg>`;
const items=[
['Graffiti',`<g class="spray-cloud" fill="#77b6e9"><path d="M8 27c-6-4-6-11 1-13 0-7 11-8 13-1 7 0 9 8 3 12l-5 6-12-4Z"/></g><g class="spray-dots" fill="#426b9d"><circle cx="11" cy="33" r="1.6"/><circle cx="8" cy="39" r="1.2"/><circle cx="17" cy="37" r="1"/></g><g class="stroke"><rect x="33" y="21" width="14" height="29" rx="2"/><path d="M34 28h12M38 21v-5h5v5M36 43h8"/></g><g class="spray-head stroke"><path d="M35 14h11v4H35zM35 16h-5"/></g>`,false],
['E-Mail',`<g class="stroke"><rect x="9" y="18" width="42" height="29" rx="3"/><path d="m10 22 20 15 20-15"/></g><g class="mail-letter"><rect x="19" y="4" width="22" height="16" rx="2" fill="#a8d7f6"/><path d="m20 7 10 7 10-7" class="stroke"/></g><path class="mail-flap stroke" d="m10 22 20 15 20-15"/>`,true],
['Telefon',`<g class="phone-body stroke"><path d="M18 9h9l3 11-6 5c3 7 8 12 15 15l5-6 11 3v9c0 4-4 6-8 5C26 47 12 33 9 15c-1-4 2-6 9-6Z" transform="translate(-2 0) scale(.9)"/></g><g class="phone-wave1 stroke"><path d="M35 11c8 1 13 6 14 14"/></g><g class="phone-wave2 stroke"><path d="M35 17c5 1 7 3 8 8"/></g>`,true],
['Vor Ort',`<g class="pin stroke"><path d="M30 52S15 35 15 25a15 15 0 0 1 30 0c0 10-15 27-15 27Z"/><circle cx="30" cy="25" r="5"/></g><ellipse cx="30" cy="55" rx="10" ry="2" fill="currentColor" opacity=".15"/>`,false],
['Nur Strom',`<g class="plug stroke"><path d="M23 11v15M37 11v15M19 26h22v5a11 11 0 0 1-22 0v-5ZM30 42v9"/></g><path class="spark stroke" d="m45 14 4-4m-3 13h6"/>`,false],
['Maschinenteile',`<g class="gear stroke"><path d="m27 8 6 0 1.5 6 4 2 6-2 4 5-3 5 1 5 5 4-3 6-6-1-4 3-1 6-7 1-2-6-4-2-6 2-4-5 3-5-1-5-5-4 3-6 6 1 4-3z"/><circle cx="30" cy="28" r="7"/></g>`,false],
['Sicherheit',`<path class="stroke" d="m30 7 19 8v14c0 12-8 19-19 24-11-5-19-12-19-24V15l19-8Z"/><path class="shield-check stroke" d="m22 30 6 6 12-13"/>`,true],
['Puls',`<path class="stroke" opacity=".2" d="M5 31h50"/><path class="pulse-line stroke" d="M5 31h13l6-12 8 26 7-15h16"/>`,true],
['Chemiefrei',`<g class="leaf stroke"><path d="M12 44C12 22 28 11 49 10c0 20-11 36-29 35-6 0-8-4-8-1Z"/><path d="M12 50c8-15 18-24 30-31M24 34l-2-9M32 26l9 2"/></g>`,false],
['Ruß',`<g class="fire stroke"><path d="M30 7c4 12-4 14 3 23 1-7 7-11 8-15 15 19 7 36-11 36S7 34 18 22c0 10 4 13 7 14C25 25 29 21 30 7Z"/></g>`,false],
['Industrie',`<g class="stroke"><path d="M9 50V28l13 8V25l13 10V21l16 10v19H9Z"/><path d="M17 42h3m7 0h3m7 0h3m-24-9V12h8v15"/></g><path class="factory-smoke stroke" d="M13 10c-3-3 3-5 0-8"/>`,true],
['Chat',`<g class="stroke"><path d="M10 27c0-11 9-19 20-19s20 8 20 19-9 19-20 19c-4 0-7-1-10-3l-10 5 3-11c-2-3-3-6-3-10Z"/><path d="M20 27h20"/></g><g class="spark fill"><circle cx="23" cy="27" r="2"/><circle cx="30" cy="27" r="2"/><circle cx="37" cy="27" r="2"/></g>`,true]];
let playing=true;const root=document.getElementById('gallery');function render(){root.innerHTML=items.map(([name,svg,dark],i)=>`<article tabindex="0" role="button" aria-label="${name} Animation neu starten" class="tile ${dark?'dark':''}" data-i="${i}"><div class="iconbox">${s(svg)}</div><strong>${name}</strong><small>↻ Animation ansehen</small></article>`).join('');root.querySelectorAll('.tile').forEach(el=>{const reset=()=>{const icon=el.querySelector('.ico');icon.classList.remove('animated');void icon.offsetWidth;icon.classList.add('animated')};el.addEventListener('click',reset);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reset()}})});if(!playing)document.body.classList.add('paused')};render();document.getElementById('toggle').onclick=()=>{playing=!playing;document.body.classList.toggle('paused',!playing);document.getElementById('toggle').textContent=playing?'⏸ Animation pausieren':'▶ Animation starten'};document.getElementById('replay').onclick=()=>{root.querySelectorAll('.ico').forEach(i=>i.classList.remove('animated'));void root.offsetWidth;root.querySelectorAll('.ico').forEach(i=>i.classList.add('animated'))};
</script></body></html>
